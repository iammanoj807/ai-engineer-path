# Welcome and reminder emails to signed-in learners (emails/README.md has the setup).
# Every hour: welcome anyone who signed up. Every day: remind anyone away for a week.
#
# Off until set up: nothing runs until the EMAILS_START variable is set, and it
# is a dry run (it sends nothing) until the EMAILS_LIVE variable is "true".
name: Learner emails

on:
  schedule:
    - cron: '17 * * * *' # every hour: welcome emails
    - cron: '45 9 * * *' # every day at 09:45 UTC: reminders
  workflow_dispatch:
    inputs:
      pass:
        description: Which emails
        type: choice
        options: [welcome, reminders]
        default: welcome

permissions:
  contents: read

concurrency:
  group: learner-emails
  cancel-in-progress: false

jobs:
  send:
    if: vars.EMAILS_START != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: emails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: emails/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node send.mjs
        env:
          PASS: ${{ github.event.schedule == '45 9 * * *' && 'reminders' || inputs.pass || 'welcome' }}
          EMAILS_START: ${{ vars.EMAILS_START }}
          LIVE: ${{ vars.EMAILS_LIVE }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
